# ==========================================================================
#  依赖锁定清单（LOCK）—— 逐位复现当时的运行环境
#
#  【用途】
#      requirements.txt 写的是"允许的范围"（如 selenium>=4.19,<5），
#      本文件写的是"当时实际装的精确版本"（selenium==4.19.0 + 全部传递依赖）。
#
#      CI 上装它，就能保证"今天跑过的版本，半年后还能原样跑出来"。
#      排查"昨天好好的今天挂了"时，第一步就是确认 lock 有没有被人动过。
#
#  【怎么用】
#      精确复现：pip install -r requirements.lock
#      重新生成：pip freeze > requirements.lock   （在干净的 venv 里执行）
#
#  【★ 什么时候必须更新】
#     有意升级依赖时（如 selenium 小版本升级），需要：
#       1. 在干净的虚拟环境里按 requirements.txt 重装
#       2. pip freeze > requirements.lock
#       3. 跑全量框架单测 + 一轮冒烟，确认无回归
#       4. 在提交信息里写明"升级了什么、为什么、验证了什么"
#     **不要**在生产分支上随手 pip install -U 之后 freeze 覆盖本文件 ——
#     那等于把"未经验证的版本"固化成了标准。
#
#  【生成环境】
#     Python 3.11.9 / Windows / 2026-10-11
# ==========================================================================

